<!DOCTYPE html>
<html>

<head>
    <title>Student Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/prof.css">
</head>

<body>

    <div class="left-lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <header>
        <a href="dashboard.html">
            <button class="menu-circle1">&larr;</button>
        </a>

        <h2 class="greeting">
            Hey, 25DCE001 !
        </h2>
    </header>

    <div class="title">
        Profile
    </div>

    <div class="profile-container">

        <div class="profile-photo">
            <img src="profile.png" alt="Student Profile">
        </div>

        <div class="profile-info">

            <div class="row">
                <span class="label">Name</span>
                <span class="value">Margi Ruparel</span>
            </div>

            <div class="row">
                <span class="label">Student ID</span>
                <span class="value">25DCE001</span>
            </div>

            <div class="row">
                <span class="label">Department</span>
                <span class="value">Computer Engineering</span>
            </div>

            <div class="row">
                <span class="label">Semester</span>
                <span class="value">3</span>
            </div>

            <div class="row">
                <span class="label">Division</span>
                <span class="value">A</span>
            </div>

            <div class="row">
                <span class="label">Email</span>
                <span class="value">margi@gmail.com</span>
            </div>

            <div class="row">
                <span class="label">Mobile</span>
                <span class="value">9876543210</span>
            </div>

            <div class="row">
                <span class="label">Date of Birth</span>
                <span class="value">29/12/2007</span>
            </div>

            <div class="row">
                <span class="label">Address</span>
                <span class="value">Ahmedabad, Gujarat</span>
            </div>

        </div>

    </div>
    <script src="../Prac_4/theme.js"></script>
</body>
</html>
