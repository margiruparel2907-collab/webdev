<!DOCTYPE html>
<html>

<head>
  <title>Student portal</title>
<link rel="stylesheet" href="../CSS/edit.css">
</head>

  <body>
	<div class="left-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
</div>
    <header>
        <a href="menu.html">
    <button class="menu-circle1">&larr;</button></a>
    </button>
    <h2 class="greeting">
        Hey, 25DCE001 !
    </h2>
   </header>
   <div class="title">
    Edit-Profile!                                                                           
</div>
   <div class="profile-container">

    <div class="photo-section">
        <img src="profile.png" alt="Profile Photo" class="profile-pic">

        <button class="photo-btn">
            Change Photo
        </button>
    </div>

    <div class="form-section">

        <label>Student ID</label>
        <input type="text" value="25DCE001" readonly>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Mobile Number</label>
        <input type="text" placeholder="Enter mobile number">

        <label>Department</label>
        <input type="text" value="Computer Engineering">

        <label>Semester</label>
        <input type="text" value="3">

        <label>Address</label>
        <textarea rows="4" placeholder="Enter Address"></textarea>

        <div class="buttons">
            <button class="save-btn">Save Changes</button>
            <button class="cancel-btn">Cancel</button>
        </div>

    </div>

</div>
    	
</body>

</html>
