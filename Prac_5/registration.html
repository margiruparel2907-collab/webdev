<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="registration-container">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Create your student account
        </p>


        <form id="registrationForm">


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

            <span id="nameError"></span>


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <span id="emailError"></span>


            <!-- MOBILE -->

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
            >

            <span id="mobileError"></span>


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <span id="passwordError"></span>


            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter password"
            >

            <span id="confirmPasswordError"></span>


            <!-- COURSE -->

            <label for="course">
                Course
            </label>

            <select id="course">

                <option value="">
                    Select Course
                </option>

                <option value="Computer Engineering">
                    Computer Engineering
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Mechanical Engineering">
                    Mechanical Engineering
                </option>

                <option value="Electrical Engineering">
                    Electrical Engineering
                </option>

            </select>

            <span id="courseError"></span>


            <!-- YEAR -->

            <label for="year">
                Year
            </label>

            <select id="year">

                <option value="">
                    Select Year
                </option>

                <option value="1">
                    1st Year
                </option>

                <option value="2">
                    2nd Year
                </option>

                <option value="3">
                    3rd Year
                </option>

                <option value="4">
                    4th Year
                </option>

            </select>

            <span id="yearError"></span>


            <!-- GENDER -->

            <label>
                Gender
            </label>

            <div class="gender-group">

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Male"
                    >
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Female"
                    >
                    Female
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Other"
                    >
                    Other
                </label>

            </div>

            <span id="genderError"></span>


            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                >

                <label for="terms">
                    I accept the Terms and Conditions
                </label>

            </div>

            <span id="termsError"></span>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="registerButton"
            >
                Register
            </button>


            <!-- SUCCESS MESSAGE -->

            <p id="successMessage"></p>

        </form>

    </div>


    <script src="registration.js"></script>

</body>

</html>
